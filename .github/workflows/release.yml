name: Release

# Publishes a GitHub release when a version tag is pushed, for example:
#   git tag 2.1 && git push origin 2.1
# The tag must match versionName in app/build.gradle.kts, and CHANGELOG.md needs a
# "## 2.1" section, which becomes the release notes.
#
# Signing: to attach an APK signed with Ninpo's release key, add these repository
# secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64   the keystore file, base64-encoded
#   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# Without them the APK is signed with a temporary test key and the release is marked
# as a pre-release. After adding the secrets, run this workflow again from the
# Actions tab on the same tag ("Use workflow from" > Tags) to replace the APK and
# publish the release as final.

on:
  push:
    tags: ["[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag and find its release notes
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Run this on a version tag (Use workflow from > Tags)."; exit 1
          fi
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match versionName $version."; exit 1
          fi
          awk -v v="$GITHUB_REF_NAME" '/^## /{ if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' section."; exit 1
          fi

      - name: Test
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease bundleRelease
            rm -f "$RUNNER_TEMP/release.jks"
            cp app/build/outputs/apk/release/app-release.apk "Ninpo-Scout-$GITHUB_REF_NAME.apk"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            SIGN_RELEASE_WITH_DEBUG_KEY=true ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "Ninpo-Scout-$GITHUB_REF_NAME-test.apk"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      # The signed App Bundle is what Google Play takes. It stays with the run
      # (Actions tab > the run > Artifacts) rather than on the public release page.
      - name: Keep the App Bundle for Google Play
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ninpo-scout-${{ github.ref_name }}-app-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$SIGNED" = "true" ]; then
            apk="Ninpo-Scout-$tag.apk"
            prerelease=false
          else
            apk="Ninpo-Scout-$tag-test.apk"
            prerelease=true
            printf '\n### About this download\n\nThis APK is a test build signed with a temporary key. A build signed with Ninpo'"'"'s key will replace it; installing that one may require uninstalling this one first.\n' >> notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            for old in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if [ "$old" != "$apk" ]; then gh release delete-asset "$tag" "$old" --yes; fi
            done
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --title "v$tag - Ninpo Scout" --notes-file notes.md --prerelease="$prerelease"
          else
            gh release create "$tag" "$apk" --verify-tag --title "v$tag - Ninpo Scout" \
              --notes-file notes.md --prerelease="$prerelease"
          fi
