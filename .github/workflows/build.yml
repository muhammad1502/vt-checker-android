name: Build

# Runs the tests and lint and builds the app on every branch push and pull request.
# The debug APK is attached to each run (Actions tab > the run > Artifacts) so it
# can be installed on a phone for testing. The App Bundle is built only to prove it
# still builds; it is unsigned, so it can't be uploaded to Google Play as is.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug bundleRelease

      - name: Attach the test APK
        uses: actions/upload-artifact@v4
        with:
          name: ninpo-scout-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Attach test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
