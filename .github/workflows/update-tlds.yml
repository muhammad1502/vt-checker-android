name: Refresh domain list

# On the 1st of each month, checks IANA's list of top-level domains, which the app
# uses to spot domains in selected text. If the list changed, pushes a branch and
# opens a pull request. New personal repositories don't let workflows open pull
# requests (Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests"), so without that setting it opens an issue linking to the
# branch instead. Can also be run by hand from the Actions tab.

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Regenerate Tlds.java
        run: python3 scripts/update_tlds.py

      - name: Propose the change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "The list hasn't changed."
            exit 0
          fi
          branch="update-tlds-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update the top-level domain list from IANA"
          git push --force origin "$branch"
          title="Update the top-level domain list"
          body="IANA's list of top-level domains changed. This regenerates Tlds.java with scripts/update_tlds.py."
          if ! gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            gh issue create --title "$title" \
              --body "$body Open a pull request from the $branch branch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
          fi
